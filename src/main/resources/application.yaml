spring:
  config:
    import: actuator.yaml

  profiles:
    default: local
    include: oauth, aws

  datasource:
    url: jdbc:h2:mem:local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 3

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: None
        secure: true

logging:
  level:
    org.hibernate:
      type:
        descriptor:
          sql: trace
      orm:
        jdbc:
          bind: trace

jwt:
  issuer: 10Second
  client-secret: ${JWT_SECRET}
  expiry-seconds: 3160000

cors:
  origin: ${CORS_ORIGIN}

---
spring:
  config:
    activate:
      on-profile: local
  sql:
    init:
      mode: always
  data:
    redis:
      port: 6379
      host: ${REDIS_HOST}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true


logging:
  level:
    org.hibernate:
      type:
        descriptor:
          sql: trace
    org.springframework.security: DEBUG

cors:
  origin: "http://localhost:5173"

---
spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: dev
  data:
    redis:
      port: 6379
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 100
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
  sql.init.mode: never

server:
  port: ${SERVER_PORT}

---
spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: prod
  data:
    redis:
      port: 6379
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 100
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect

  sql.init.mode: never


